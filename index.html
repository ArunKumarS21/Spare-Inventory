<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#0f172a;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1050px;margin:auto}.brand{font-size:23px;font-weight:800}.sub{font-size:12px;color:#cbd5e1}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.container{padding:14px}
.search{display:flex;gap:8px;background:white;padding:9px;border-radius:15px;box-shadow:0 3px 15px #0001}
.search input{flex:1;border:0;outline:0;font-size:16px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}
.dark{background:#0f172a;color:white}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.gray{background:#e2e8f0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.stat,.card{background:white;border-radius:16px;padding:14px;box-shadow:0 3px 15px #0001}
.stat b{font-size:22px}.stat small{display:block;color:#64748b}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}
.tabs button{white-space:nowrap}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.filters select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:white}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:17px;font-weight:800}.code,.muted{font-size:12px;color:#64748b}
.badge{padding:6px 9px;border-radius:99px;font-size:11px;font-weight:800}.ok{background:#dcfce7;color:#166534}.low{background:#fee2e2;color:#991b1b}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.info div{background:#f8fafc;border-radius:10px;padding:10px}.info small{display:block;color:#64748b;font-size:10px}
.actions{display:flex;gap:7px}.actions button{flex:1}.item{padding:11px 0;border-bottom:1px solid #e2e8f0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.show{display:flex}
.sheet{background:white;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}
.empty{text-align:center;color:#64748b;padding:28px}.issue{color:#b91c1c;font-weight:800}.add{color:#15803d;font-weight:800}
.source{font-size:11px;color:#64748b;margin:8px 0}.count{font-size:12px;color:#475569;margin:8px 2px}
@media(min-width:700px){.modal{align-items:center;justify-content:center}.sheet{max-width:560px;border-radius:20px}}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr 1fr}.actions{flex-wrap:wrap}.actions button{min-width:30%}}
</style></head>

function rebuildFromChunks(){
  const all=[];
  Object.keys(chunkCache).sort().forEach(k=>{ (chunkCache[k]||[]).forEach(it=>all.push(it)); });
  data=all;
  idToChunk={};
  Object.keys(chunkCache).forEach(k=>{ (chunkCache[k]||[]).forEach(it=>{ idToChunk[String(it.id)]=k; }); });
}

async function ensureSeeded(){
  const metaRef=dbNs.doc('meta/seed');
  let snap;
  try{ snap=await metaRef.get(); }catch(e){ snap={exists:false}; }
  if(snap.exists && snap.data() && snap.data().seeded){ return; }
  // Seed chunks from EXCEL_SPARES
  const chunks=[];
  for(let i=0;i<EXCEL_SPARES.length;i+=CHUNK_SIZE){
    chunks.push(EXCEL_SPARES.slice(i,i+CHUNK_SIZE).map(x=>({...x})));
  }
  for(let i=0;i<chunks.length;i++){
    try{ await dbNs.doc('spares_chunks/chunk_'+i).set({items:chunks[i]}); }catch(e){ /* ignore, may already exist from a race */ }
  }
  try{ await metaRef.set({seeded:true,seededAt:new Date().toISOString(),chunkCount:chunks.length}); }catch(e){}
}

function subscribeSpares(){
  const col=dbNs.collection('spares_chunks');
  unsubChunks=col.onSnapshot(snap=>{
    snap.docs.forEach(d=>{ chunkCache[d.id]=(d.data()&&d.data().items)||[]; });
    rebuildFromChunks();
    initFilters();
    render();
  }, err=>{ console.error('spares subscribe error',err); });
}

function subscribeHistory(){
  unsubHist=dbNs.doc('history/log').onSnapshot(snap=>{
    hist=(snap.exists && snap.data() && snap.data().entries)||[];
    if(tab==='history') render();
  }, err=>{ console.error('history subscribe error',err); });
}

async function initDb(){
  try{
    const configured = firebaseConfig && firebaseConfig.projectId && firebaseConfig.projectId!=="YOUR_PROJECT_ID";
    if(configured && window.firebase){
      if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
      dbNs = firebase.firestore();
    } else {
      dbNs = null;
      console.warn('Firebase not configured yet — running in local-only mode. Fill in firebaseConfig near the top of this file.');
    }
  }catch(e){ console.error('Firebase init failed',e); dbNs=null; }
  if(!dbNs){
    // Offline fallback: local-only, no cross-device sync
    data=EXCEL_SPARES.map(x=>({...x}));
    hist=[];
    dbReady=false;
    initFilters();render();
    return;
  }
  dbReady=true;
  await ensureSeeded();
  subscribeSpares();
  subscribeHistory();
}

async function writeChunkFor(itemId, mutateFn){
  // mutateFn(chunkArray) mutates array in place, or returns a new array
  let key=idToChunk[String(itemId)];
  if(!key){
    // brand new item: append to the last known chunk, or create a new one if full
    const keys=Object.keys(chunkCache).sort();
    key=keys.length?keys[keys.length-1]:'chunk_0';
    if((chunkCache[key]||[]).length>=CHUNK_SIZE*1.25){
      const n=keys.length?parseInt(keys[keys.length-1].split('_')[1],10)+1:0;
      key='chunk_'+n;
      chunkCache[key]=[];
    }
  }
  const arr=(chunkCache[key]||[]).slice();
  const result=mutateFn(arr)||arr;
  chunkCache[key]=result;
  idToChunk[String(itemId)]=key;
  if(dbReady){
    try{ await dbNs.doc('spares_chunks/'+key).set({items:result}); }
    catch(e){ console.error('write chunk failed',e); }
  }else{
    rebuildFromChunks();initFilters();render();
  }
}

async function writeHistory(newEntries){
  hist=newEntries;
  if(dbReady){
    try{ await dbNs.doc('history/log').set({entries:hist.slice(0,500)}); }
    catch(e){ console.error('write history failed',e); }
  }else{
    render();
  }
}

function opts(field){
  return [...new Set(data.map(x=>x[field]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
}
function initFilters(){
  const af=document.getElementById('areaFilter'),cf=document.getElementById('catFilter');
  const prevA=af.value, prevC=cf.value;
  af.innerHTML='<option value="">All Areas</option>'+opts('area').map(x=>`<option>${esc(x)}</option>`).join('');
  cf.innerHTML='<option value="">All Categories</option>'+opts('category').map(x=>`<option>${esc(x)}</option>`).join('');
  if([...af.options].some(o=>o.value===prevA)) af.value=prevA;
  if([...cf.options].some(o=>o.value===prevC)) cf.value=prevC;
}
function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const area=document.getElementById('areaFilter').value, cat=document.getElementById('catFilter').value;
  const low=data.filter(x=>Number(x.qty)<=Number(x.min)), units=data.reduce((a,x)=>a+(Number(x.qty)||0),0);
  document.getElementById('stats').innerHTML=
    `<div class=stat><b>${data.length}</b><small>Total Spare Records</small></div>
     <div class=stat><b>${units}</b><small>Total Units in Stock</small></div>
     <div class=stat><b>${low.length}</b><small>Low Stock</small></div>
     <div class=stat><b>${opts('area').length}</b><small>Areas</small></div>`;
  if(tab==='history'){renderHistory();return}
  let a=data.filter(x=>{
    const text=[x.name,x.code,x.loc,x.area,x.equip,x.make,x.spec,x.category,x.sl].join(' ').toLowerCase();
    return text.includes(q)&&(!area||x.area===area)&&(!cat||x.category===cat);
  });
  if(tab==='alerts')a=a.filter(x=>Number(x.qty)<=Number(x.min));
  document.getElementById('count').textContent=`Showing ${a.length} of ${data.length} spare records`+(dbReady?' · synced':' · offline (not synced)');
  document.getElementById('content').innerHTML=a.length?a.map(card).join(''):'<div class=card><div class=empty>No spares found.</div></div>';
}

async function saveModal(){
 if(mode==='new'||mode==='edit'){
  let n=fname.value.trim(),c=fcode.value.trim(),q=Math.max(0,+fqty.value||0),m=Math.max(0,+fmin.value||0),l=floc.value.trim(),u=funit.value.trim()||'Nos';
  if(!n||!c||!l)return alert('Fill name, code and location.');
  if(mode==='new'){
    const newId=Date.now();
    const newItem={id:newId,name:n,code:c,qty:q,min:m,loc:l,unit:u,area:farea.value.trim(),category:fcat.value.trim(),equip:'',make:'',spec:'',sl:'',max:m,cost:0};
    await writeChunkFor(newId, arr=>{ arr.push(newItem); return arr; });
  }else{
    await writeChunkFor(id, arr=>{
      const idx=arr.findIndex(a=>a.id===id);
      if(idx>-1) Object.assign(arr[idx],{name:n,code:c,qty:q,min:m,loc:l,unit:u,area:farea.value.trim(),category:fcat.value.trim()});
      return arr;
    });
  }
 }else{
  let x=data.find(a=>a.id===id),n=Math.max(0,+tqty.value||0);if(n<1)return alert('Enter a quantity greater than 0.');
  if(mode==='issue'&&n>x.qty)return alert('Cannot issue more than current stock.');
  let d=mode==='issue'?-n:n, newQty=x.qty+d;
  await writeChunkFor(id, arr=>{
    const idx=arr.findIndex(a=>a.id===id);
    if(idx>-1) arr[idx].qty=newQty;
    return arr;
  });
  const note=tnote.value.trim();
  const newEntry={type:mode==='issue'?'ISSUE':'ADD STOCK',name:x.name,code:x.code,delta:d,after:newQty,note,time:new Date().toLocaleString()};
  await writeHistory([newEntry,...hist]);
 }
 if(!dbReady){ rebuildFromChunks(); initFilters(); }
 closeModal();render();
}
function renderHistory(){
 const q=document.getElementById('search').value.toLowerCase(),h=hist.filter(a=>(a.name+' '+a.code+' '+a.type+' '+a.note).toLowerCase().includes(q));
 document.getElementById('count').textContent=`${h.length} transactions`+(dbReady?' · synced':' · offline (not synced)');
 document.getElementById('content').innerHTML=`<div class=card><div class=row><b>Transaction History</b><button class="btn gray" onclick="clearHistory()">Clear</button></div>
 ${h.length?h.map(a=>`<div class=item><div class=row><span class="${a.type==='ISSUE'?'issue':'add'}">${a.type} · ${esc(a.name)}</span><b>${a.delta>0?'+':''}${a.delta}</b></div>
 <div class=muted>${esc(a.code)} · ${esc(a.note||'No note')} · ${a.time}</div><div class=muted>Stock after: ${a.after}</div></div>`).join(''):'<div class=empty>No transactions yet.</div>'}</div>`;
}
async function clearHistory(){if(confirm('Clear all history?')){ await writeHistory([]); render(); }}
function switchTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.className='btn gray');event.currentTarget.className='btn blue';render()}
async function resetToExcel(){
 if(confirm('Reload the original Excel spare list? This will discard edits and stock transactions for EVERYONE using this shared inventory.')){
  const chunks=[];
  for(let i=0;i<EXCEL_SPARES.length;i+=CHUNK_SIZE){ chunks.push(EXCEL_SPARES.slice(i,i+CHUNK_SIZE).map(x=>({...x}))); }
  if(dbReady){
    const existingKeys=Object.keys(chunkCache);
    for(const k of existingKeys){ try{ await dbNs.doc('spares_chunks/'+k).delete(); }catch(e){} }
    for(let i=0;i<chunks.length;i++){ try{ await dbNs.doc('spares_chunks/chunk_'+i).set({items:chunks[i]}); }catch(e){} }
    await writeHistory([]);
  }else{
    chunkCache={}; chunks.forEach((c,i)=>{ chunkCache['chunk_'+i]=c; });
    rebuildFromChunks(); hist=[];
  }
  initFilters();render();
 }
}
initFilters();render();

// ===== Simple email/password login gate (Firebase Authentication) =====
let authNs = null;
try{
  const configured = firebaseConfig && firebaseConfig.projectId && firebaseConfig.projectId!=="YOUR_PROJECT_ID";
  if(configured && window.firebase){
    if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    authNs = firebase.auth();
  }
}catch(e){ console.error('Auth init failed', e); authNs=null; }

let dbStarted = false;
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appRoot').style.display='block';
  if(!dbStarted){ dbStarted = true; initDb(); }
}
function showLogin(msg){
  document.getElementById('appRoot').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginError').innerText = msg || '';
}

if(authNs){
  authNs.onAuthStateChanged(user => { if(user){ showApp(); } else { showLogin(); } });
} else {
  // No Firebase Auth configured — skip login and just run the app (local-only mode).
  showApp();
}

let authMode = 'login'; // 'login' or 'signup'
function toggleAuthMode(){
  authMode = (authMode === 'login') ? 'signup' : 'login';
  document.getElementById('loginError').innerText = '';
  document.getElementById('loginBtn').innerText = (authMode === 'login') ? 'Log In' : 'Create Account';
  document.getElementById('toggleModeText').innerText = (authMode === 'login') ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('toggleModeLink').innerText = (authMode === 'login') ? 'Sign up' : 'Log in';
}
function doAuthAction(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.innerText = '';
  if(!authNs){ errEl.innerText = 'Login is not configured yet.'; return; }
  if(!email || !pass){ errEl.innerText = 'Enter both email and password.'; return; }
  if(pass.length < 6){ errEl.innerText = 'Password must be at least 6 characters.'; return; }
  const action = (authMode === 'login')
    ? authNs.signInWithEmailAndPassword(email, pass)
    : authNs.createUserWithEmailAndPassword(email, pass);
  action.catch(e => { errEl.innerText = e.message.replace('Firebase: ',''); });
}
function doLogout(){
  if(authNs){ authNs.signOut(); }
}
document.getElementById('loginPassword') && document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter'){ doAuthAction(); } });

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
</script>
